name: Question quality

# ukalab_core の再利用可能ワークフローを呼ぶだけ（警告のみ。strict は付けない）。
on:
  pull_request:
    paths:
      - 'assets/questions/**'
      - '.github/workflows/question-quality.yml'

jobs:
  question-quality:
    uses: zka32101/ukalab_core/.github/workflows/question-quality.yml@main
    with:
      files: 'assets/questions/*.jsonl'
      choices_key: choices
      answer_key: answerIndex
      category_key: subjectId
